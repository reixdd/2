name: Build DIT 3D GLB assets
on:
  push:
    branches: [dit-3d-assets]
    paths:
      - 'dit-assets/build_models.py'
      - '.github/workflows/dit-build-assets.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install model exporter
        run: python -m pip install "numpy>=1.26,<3" "trimesh>=4.5,<5" "pillow>=10" "scipy>=1.11"
      - name: Generate nine GLB files
        run: python dit-assets/build_models.py
      - name: Verify binary GLB models
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, struct
          files=sorted(Path("dit-assets").glob("*.glb"))
          assert len(files)==9, [x.name for x in files]
          for f in files:
              b=f.read_bytes()
              assert b[:4]==b"glTF"
              length,tag=struct.unpack_from("<II",b,12)
              obj=json.loads(b[20:20+length])
              assert obj["asset"]["version"]=="2.0"
              print(f.name,len(b))
          PY
      - name: Commit generated assets to isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p dit-assets/models
          mv dit-assets/*.glb dit-assets/models/
          git add dit-assets/models/*.glb
          if ! git diff --cached --quiet; then
            git commit -m "Generate nine DIT 3D GLB assets"
            git push
          fi
